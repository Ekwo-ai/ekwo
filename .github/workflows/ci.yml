name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds both workspaces; the CLI also copies supabase/ into its dist.
      - run: npm run build
      # The published binary has to run. A broken shebang or a missing export
      # only shows up here, never in a unit test.
      - run: node packages/cli/dist/bin.js --help
      - run: node packages/cli/dist/bin.js --version
      # The MCP server's binary too: it is started by a client, so a broken
      # entry point shows up as "server failed to start" and nothing else.
      - run: node packages/mcp/dist/bin.js --help
      - run: node packages/mcp/dist/bin.js --version
      # And the copy of the schema inside the package has to be the real one.
      - name: The CLI ships the repository's migrations
        run: |
          diff -r --exclude='*.md' supabase/migrations packages/cli/dist/assets/migrations
          diff -r --exclude='*.md' supabase/seed packages/cli/dist/assets/seed
          # And the inventory `ekwo doctor` compares a database against. A
          # stale copy inside the package would report objects as missing that
          # the release never defined.
          diff packages/cli/assets/expected-objects.json \
               packages/cli/dist/assets/expected-objects.json
      # The modules travel with the CLI too: `ekwo migrate` applies them, and a
      # user running `npx ekwo` has no clone to read them from.
      - name: The CLI ships the modules
        run: |
          for module in modules/*/; do
            name=$(basename "$module")
            [ "$name" = "schema" ] && continue
            diff "$module/module.json" "packages/cli/dist/assets/modules/$name/module.json"
            diff -r "$module/supabase/migrations" \
                    "packages/cli/dist/assets/modules/$name/supabase/migrations"
          done
          diff modules/schema/module.1.json packages/cli/dist/assets/modules/schema/module.1.json

  hygiene:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: "additive" is a question about what came
      # before, and a shallow clone cannot answer it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The country seeds are compiled from packs/. A seed that is no longer
      # the exact output of its pack means the two have drifted, and the pack
      # is the source.
      - name: The country seeds are the output of their packs
        run: |
          npm run build --workspace ekwo
          node packages/cli/dist/bin.js pack check --all
      - name: No private data in the repository
        run: node scripts/check-no-private-data.mjs
      # A test that names BE and FR by hand is a test of the two countries
      # somebody remembered. The next pack is then a diff across a dozen test
      # files, and until that diff is written the pack proves nothing.
      - name: No country is enumerated in what the tests expect
        run: node scripts/check-no-country-literals-in-tests.mjs
      # An amount is rounded at the decimals of its currency, through one
      # function. A `round(x, 2)` in a new migration is the assumption that
      # every currency has cents, and it is wrong for about a quarter of them.
      - name: No hard-coded rounding in a new migration
        run: node scripts/check-rounding.mjs
      - name: No secret committed in .env.example
        run: |
          # The example file documents the variables; a real value in it would
          # be published on the first push.
          if grep -Eq '^(EKWO_DB_URL|SUPABASE_SERVICE_ROLE_KEY)=.*(eyJ[A-Za-z0-9_-]{10,})' .env.example; then
            echo ".env.example holds what looks like a real key."
            exit 1
          fi
      - name: Migrations are additive
        run: |
          set -euo pipefail
          # A released migration must never be edited. It has run on databases
          # we do not control, and a new file is the only way to correct one.
          #
          # This used to run on `pull_request` only, and everything was pushed
          # straight to `main` — so between 11 and 13 September 2026 eight
          # published migrations were edited across two and three commits each
          # and the job never looked. It now runs on both events, and on a
          # push to `main` it compares against two things: the commit that was
          # there a moment ago, and the latest tag, which is the released set.
          # A branch that was merged cleanly passes the first and would still
          # be caught by the second if it had rewritten a released file.
          #
          # The README of those folders is documentation, so it is not in the
          # glob.
          check() {
            base="$1"
            label="$2"
            changed=$(git diff --diff-filter=MD --name-only "$base" -- \
                        'supabase/migrations/*.sql' \
                        'modules/*/supabase/migrations/*.sql' || true)
            if [ -n "$changed" ]; then
              echo "Against $label ($base), these migrations were modified or deleted:"
              echo "$changed"
              echo "Add a new migration instead; a published one is never edited."
              exit 1
            fi
            echo "No published migration changed against $label."
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            check "origin/${{ github.base_ref }}" "the base branch"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -n "$before" ] \
             && [ "$before" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$before^{commit}" 2>/dev/null; then
            check "$before" "the previous commit of this branch"
          else
            echo "No previous commit to compare against — a first push, or a forced update."
          fi

          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$tag" ]; then
            check "$tag" "the latest tag"
          else
            echo "No tag yet, so nothing has been released and there is nothing to protect."
          fi

      # `docs/schema.md` is generated from the migrations, and a hand-written
      # line in it is a lie that outlives the person who wrote it. The
      # generator is deterministic, so the diff being empty is the whole test.
      - name: docs/schema.md is the output of the migrations
        run: |
          node scripts/generate-schema-doc.mjs
          if ! git diff --exit-code docs/schema.md; then
            echo
            echo "docs/schema.md is not what the migrations say."
            echo "Run 'npm run docs:schema' and commit the result with your migration."
            exit 1
          fi

      # The inventory `ekwo doctor` compares against, generated the same way
      # and for the same reason. Everything in it sorts on a stable key, so
      # regenerating an unchanged schema rewrites the same bytes and the diff
      # being empty is the whole test.
      - name: The expected objects are the output of the migrations
        run: |
          node scripts/generate-expected-objects.mjs
          if ! git diff --exit-code packages/cli/assets/expected-objects.json; then
            echo
            echo "The inventory is not what the migrations define, or not what they grant."
            echo "Run 'npm run inventory' and commit the result with your migration."
            echo "If a role gained a privilege you did not intend, the migration is the bug."
            exit 1
          fi
