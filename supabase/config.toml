# Ekwo OS — Supabase project configuration.
#
# `project_id` is a local label; `supabase link --project-ref <ref>` is what
# points the CLI at your own project.

project_id = "ekwo"

[db]
major_version = 15

[db.migrations]
schema_paths = []

# `supabase db reset` applies these after the migrations. The demo company
# (supabase/seed/90_demo_company.sql) is deliberately left out: apply it by
# hand when you want the sample data.
[db.seed]
enabled = true
sql_paths = [
  "./seed/00_currencies.sql",
  "./seed/05_framework_generic.sql",
  "./seed/10_pack_be.sql",
  "./seed/11_pack_fr.sql",
]

# PostgREST serves only the schemas listed here. The socle is `public`; a
# module is a schema of its own and is served only once it is added — which no
# migration can do, because this is a setting of the API and not of the
# database. `ekwo module enable` prints the line to add, and on a hosted
# project it is Project Settings → API → Exposed schemas.
#
#   schemas = ["public", "assets", "budgets"]
#
# They are left out by default: a module nobody enabled is a schema nobody
# should be able to reach over the API.
[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
enabled = true
